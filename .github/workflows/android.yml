name: Android APK Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🔥 MAGIC STEP: Yeh block missing configuration files ko automatic generate kar dega
    - name: Auto-Create Missing Config Files
      run: |
        echo "Creating gradle.properties..."
        echo "android.useAndroidX=true" > gradle.properties
        
        echo "Creating/Overwriting root build.gradle..."
        echo -e "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath 'com.android.tools.build:gradle:8.2.2'\n    }\n}" > build.gradle

        echo "Creating/Overwriting settings.gradle..."
        echo -e "pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = \"HelloWorld\"\ninclude ':app'" > settings.gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-hello-world-apk
        path: app/build/outputs/apk/debug/app-debug.apk
